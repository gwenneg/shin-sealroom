# A minimal configuration for the image's smoke test: every request refused.
dns:
  listen: ":53"
  proxy_ip: "127.0.0.1"
proxy:
  http_listen: ":80"
  https_listen: ":443"
metrics:
  listen: "127.0.0.1:9090"
tls:
  mode: "mitm"
  ca_cert: "/etc/sealroom/ca.crt"
  ca_key: "/etc/sealroom/ca.key"
transforms:
  - name: allowlist
    config:
      domains: []
