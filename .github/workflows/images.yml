# Builds both images for amd64 and arm64 on every pull request that touches
# them, and on main. Publishing is a separate decision: only when the
# repository variable PUBLISH_IMAGES is true does main push them to GitHub's
# container registry and attest their build provenance, a signed record,
# checked with `gh attestation verify`, that ties each image to this
# repository's workflow and commit. A package a workflow creates inherits the
# repository's visibility, so the packages must exist, private, before the
# first push. Actions are pinned to commit SHAs.
name: Images

on:
  push:
    branches: [main]
    paths: ['images/**', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', '.dockerignore', '.github/workflows/images.yml']
  pull_request:
    paths: ['images/**', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', '.dockerignore', '.github/workflows/images.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The proxy is Sealroom's own binary, built from the repository's root.
          - image: proxy
            context: .
          - image: agent
            context: images/agent
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/sealroom-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ env.PUBLISH == 'true' }}
      - id: build
        name: Build for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: images/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest the build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Report the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
