# Build, vet, test and scan for known vulnerabilities on every push to main
# and every pull request, build and smoke-test both images, and run the
# end-to-end tests against the real services. The job token can only read the repository. Actions
# are pinned to commit SHAs, and govulncheck to a version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: Vet, for Linux and macOS
        run: go vet ./... && GOOS=darwin go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build a static binary
        run: CGO_ENABLED=0 go build -trimpath -o sealroom ./cmd/sealroom
      - name: Scan for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  proxy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the proxy image from this repository
        run: docker build -t sealroom-proxy:ci -f images/proxy/Dockerfile .
      - name: Start it sealed and check it refuses what no rule allows
        run: |
          docker pull -q "$(sed -n 's/^curl_image=//p' images/proxy/smoke-test.sh)"
          images/proxy/smoke-test.sh sealroom-proxy:ci

  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the agent image
        run: docker build -t sealroom-agent:ci images/agent
      - name: Check its tools, the stand-ins and the session, with no network
        run: images/agent/smoke-test.sh sealroom-agent:ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build both images
        run: |
          docker build -t sealroom-proxy:dev -f images/proxy/Dockerfile .
          docker build -t sealroom-agent:dev images/agent
          docker pull -q "$(sed -n 's/^curl_image=//p' images/proxy/smoke-test.sh)"
      - name: A run's rules and a whole session, against the real services
        run: SEALROOM_E2E=1 go test -count=1 -v ./internal/e2e/

  e2e-podman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build both images with rootless Podman
        run: |
          podman version
          podman build -t sealroom-proxy:dev -f images/proxy/Dockerfile .
          podman build -t sealroom-agent:dev images/agent
          podman pull -q "$(sed -n 's/^curl_image=//p' images/proxy/smoke-test.sh)"
      - name: A run's rules and a whole session, with rootless Podman
        run: CONTAINER_RUNTIME=podman SEALROOM_E2E=1 go test -count=1 -v ./internal/e2e/
